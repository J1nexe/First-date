<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Proposal</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #ffd6e6;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ff4d88;
            font-size: 2em;
            margin-bottom: 30px;
        }

        .buttons {
            margin-top: 20px;
        }

        #yesBtn {
            padding: 20px 40px;
            font-size: 1.5em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            padding: 10px 20px;
            font-size: 1em;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            position: relative;
            transition: all 0.2s;
        }

        #noBtn:hover {
            position: fixed;
            transform: translate(
                calc(Math.random() * window.innerWidth),
                calc(Math.random() * window.innerHeight)
            );
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Do you want to go on a date with me? 🥰</h1>
        <div class="buttons">
            <button id="yesBtn">Yes!</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.clientWidth);
            const y = Math.random() * (window.innerHeight - noBtn.clientHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });
    
        yesBtn.addEventListener('click', () => {
            window.location.href = 'calendar.html';
        });
    </script> 
</body>
</html>
